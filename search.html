<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Cars - SpeedWheels</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>SpeedWheels</h1>
        </div>
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="seller.html">Seller</a></li>
                <li><a href="search.html" class="active">Search</a></li>
            </ul>
            <div class="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <main>
        <section class="search-section">
            <h2>Find Your Perfect Car</h2>
            <form id="searchForm" onsubmit="return handleSearch(event)">
                <label for="searchModel">Model:</label>
                <input type="text" id="searchModel" name="model" placeholder="Enter car model">

                <label for="searchYear">Year:</label>
                <input type="number" id="searchYear" name="year" placeholder="e.g. 2020">

                <button type="submit">Search</button>
            </form>
        </section>

        <section class="results-section">
            <h3>Search Results</h3>
            <div id="resultsContainer">
                <p class="no-results">Enter search criteria and click Search to find cars.</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 SpeedWheels. All rights reserved.</p>
            <div class="social-links">
                <a href="https://facebook.com" target="_blank">Facebook</a>
                <a href="https://twitter.com" target="_blank">Twitter</a>
                <a href="https://instagram.com" target="_blank">Instagram</a>
            </div>
        </div>
    </footer>

    <script src="validation.js"></script>
    <script>
        function toggleMenu() {
            document.querySelector('.navbar ul').classList.toggle('show');
        }

        // Demo data for search functionality
        const demoCars = [
            { colour: 'Red', model: 'Toyota Camry', year: 2020, location: 'Beijing', price: 180000, image: '' },
            { colour: 'Blue', model: 'Honda Accord', year: 2019, location: 'Shanghai', price: 160000, image: '' },
            { colour: 'Black', model: 'BMW 3 Series', year: 2021, location: 'Guangzhou', price: 280000, image: '' },
            { colour: 'White', model: 'Toyota Camry', year: 2021, location: 'Shenzhen', price: 195000, image: '' },
            { colour: 'Silver', model: 'Audi A4', year: 2020, location: 'Beijing', price: 250000, image: '' }
        ];

        function handleSearch(event) {
            event.preventDefault();
            const model = document.getElementById('searchModel').value.trim().toLowerCase();
            const year = document.getElementById('searchYear').value.trim();
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';

            let results = demoCars;
            if (model) {
                results = results.filter(car => car.model.toLowerCase().includes(model));
            }
            if (year) {
                results = results.filter(car => car.year == year);
            }

            if (results.length === 0) {
                container.innerHTML = '<p class="no-results">No cars found matching your criteria.</p>';
                return false;
            }

            results.forEach(car => {
                const card = document.createElement('div');
                card.className = 'car-card';
                card.innerHTML = `
                    <h4>${car.model}</h4>
                    <p><strong>Colour:</strong> ${car.colour}</p>
                    <p><strong>Year:</strong> ${car.year}</p>
                    <p><strong>Location:</strong> ${car.location}</p>
                    <p><strong>Price:</strong> CNY ${car.price.toLocaleString()}</p>
                `;
                container.appendChild(card);
            });
            return false;
        }
    </script>
</body>
</html>
